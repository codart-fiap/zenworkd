<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ZenWork - Editar Recurso</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#24a5e5",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111c21",
                        "card-light": "#ffffff",
                        "card-dark": "#19272e",
                        "border-light": "#e7e7e7",
                        "border-dark": "#2a3b47",
                        "text-main-light": "#0e171b",
                        "text-main-dark": "#f0f2f4",
                        "text-secondary-light": "#4e7f97",
                        "text-secondary-dark": "#a0b1c0",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark">
    <div class="relative flex min-h-screen w-full">
        <aside
            class="flex w-64 flex-col border-r border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark p-4 sticky top-0 h-screen">
            <div class="flex items-center gap-3 p-3">
                <div class="size-8 text-primary">
                    <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                       <path d="M39.5563 34.1455V13.8546C39.5563 15.708 36.8773 17.3437 32.7927 18.3189C30.2914 18.916 27.263 19.2655 24 19.2655C20.737 19.2655 17.7086 18.916 15.2073 18.3189C11.1227 17.3437 8.44365 15.708 8.44365 13.8546V34.1455C8.44365 35.9988 11.1227 37.6346 15.2073 38.6098C17.7086 39.2069 20.737 39.5564 24 39.5564C27.263 39.5564 30.2914 39.2069 32.7927 38.6098C36.8773 37.6346 39.5563 35.9988 39.5563 34.1455Z"></path>
                       <path clip-rule="evenodd" d="M10.4485 13.8519C10.4749 13.9271 10.6203 14.246 11.379 14.7361C12.298 15.3298 13.7492 15.9145 15.6717 16.3735C18.0007 16.9296 20.8712 17.2655 24 17.2655C27.1288 17.2655 29.9993 16.9296 32.3283 16.3735C34.2508 15.9145 35.702 15.3298 36.621 14.7361C37.3796 14.246 37.5251 13.9271 37.5515 13.8519C37.5287 13.7876 37.4333 13.5973 37.0635 13.2931C36.5266 12.8516 35.6288 12.3647 34.343 11.9175C31.79 11.0295 28.1333 10.4437 24 10.4437C19.8667 10.4437 16.2099 11.0295 13.657 11.9175C12.3712 12.3647 11.4734 12.8516 10.9365 13.2931C10.5667 13.5973 10.4713 13.7876 10.4485 13.8519ZM37.5563 18.7877C36.3176 19.3925 34.8502 19.8839 33.2571 20.2642C30.5836 20.9025 27.3973 21.2655 24 21.2655C20.6027 21.2655 17.4164 20.9025 14.7429 20.2642C13.1498 19.8839 11.6824 19.3925 10.4436 18.7877V34.1275C10.4515 34.1545 10.5427 34.4867 11.379 35.027C12.298 35.6207 13.7492 36.2054 15.6717 36.6644C18.0007 37.2205 20.8712 37.5564 24 37.5564C27.1288 37.5564 29.9993 37.2205 32.3283 36.6644C34.2508 36.2054 35.702 35.6207 36.621 35.027C37.4573 34.4867 37.5485 34.1546 37.5563 34.1275V18.7877ZM41.5563 13.8546V34.1455C41.5563 36.1078 40.158 37.5042 38.7915 38.3869C37.3498 39.3182 35.4192 40.0389 33.2571 40.5551C30.5836 41.1934 27.3973 41.5564 24 41.5564C20.6027 41.5564 17.4164 41.1934 14.7429 40.5551C12.5808 40.0389 10.6502 39.3182 9.20848 38.3869C7.84205 37.5042 6.44365 36.1078 6.44365 34.1455L6.44365 13.8546C6.44365 12.2684 7.37223 11.0454 8.39581 10.2036C9.43325 9.3505 10.8137 8.67141 12.343 8.13948C15.4203 7.06909 19.5418 6.44366 24 6.44366C28.4582 6.44366 32.5797 7.06909 35.657 8.13948C37.1863 8.67141 38.5667 9.3505 39.6042 10.2036C40.6278 11.0454 41.5563 12.2684 41.5563 13.8546Z" fill="currentColor" fill-rule="evenodd"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-[-0.015em] text-text-main-light dark:text-text-main-dark">ZenWork</h1>
            </div>
            <div class="flex h-full flex-col justify-between pt-8">
                <div class="flex flex-col gap-2">
                    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-secondary-light dark:text-text-secondary-dark dark:hover:bg-white/10 hover:bg-black/5"
                        href="./admin-dashboard.html">
                        <span class="material-symbols-outlined">dashboard</span>
                        <p class="text-sm font-medium leading-normal">Dashboard</p>
                    </a>
                    <a class="flex items-center gap-3 rounded-lg bg-primary/20 dark:bg-primary/30 px-3 py-2 text-primary dark:text-white"
                        href="./admin-recursos.html">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">folder</span>
                        <p class="text-sm font-medium leading-normal">Gerenciar Recursos</p>
                    </a>
                </div>
                <div class="flex flex-col gap-4 border-t border-border-light dark:border-border-dark pt-4">
                    <div class="flex gap-3 items-center">
                         <div id="user-avatar" class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                            data-alt="Avatar of Admin"
                            style='background-image: url("https://placehold.co/100x100/24a5e5/FFFFFF?text=A&font=inter");'>
                        </div>
                        <div class="flex flex-col">
                            <h1 id="user-name" class="text-base font-medium leading-normal text-text-main-light dark:text-text-main-dark">Admin...</h1>
                            <p class="text-sm font-normal leading-normal text-text-secondary-light dark:text-text-secondary-dark">Admin</p>
                        </div>
                    </div>
                     <button id="logout-button-sidebar"
                        class="flex w-full items-center justify-center gap-2 rounded-lg h-10 px-4 bg-gray-200 dark:bg-gray-700 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-opacity-90 transition-colors">
                        <span class="material-symbols-outlined text-xl">logout</span>
                        <span class="truncate">Sair</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-8">
            <div class="max-w-4xl mx-auto">
                <div class="flex flex-wrap gap-2 items-center text-sm mb-6">
                    <a class="text-text-secondary-light dark:text-text-secondary-dark hover:text-primary dark:hover:text-primary" href="./admin-dashboard.html">Painel Admin</a>
                    <span class="text-text-secondary-light dark:text-text-secondary-dark">/</span>
                    <a class="text-text-secondary-light dark:text-text-secondary-dark hover:text-primary dark:hover:text-primary" href="./admin-recursos.html">Recursos</a>
                    <span class="text-text-secondary-light dark:text-text-secondary-dark">/</span>
                    <span class="text-text-main-light dark:text-text-main-dark font-medium" id="page-title">Adicionar Recurso</span>
                </div>
                
                <h1 class="text-text-main-light dark:text-text-main-dark text-3xl font-bold tracking-tight mb-8" id="page-header">Adicionar Novo Recurso</h1>
                
                <div id="message-box" class="hidden w-full px-4 py-3 rounded-lg mb-6" role="alert">
                    <span class="block sm:inline" id="message-text"></span>
                </div>
                
                <div class="bg-card-light dark:bg-card-dark rounded-xl border border-border-light dark:border-border-dark shadow-sm">
                    <form id="recurso-form" class="p-8 space-y-8">
                        
                        <input type="hidden" id="idRecurso" name="idRecurso" value="">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="flex flex-col">
                                <label class="text-text-main-light dark:text-text-main-dark text-sm font-medium pb-2" for="titulo">Título</label>
                                <input class="form-input w-full rounded-lg text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark/50 focus:border-primary h-12 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark px-4 text-base"
                                    id="titulo" name="titulo" required />
                            </div>
                            <div class="flex flex-col">
                                <label class="text-text-main-light dark:text-text-main-dark text-sm font-medium pb-2" for="categoria">Categoria</label>
                                <input class="form-input w-full rounded-lg text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark/50 focus:border-primary h-12 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark px-4 text-base"
                                    id="categoria" name="categoria" placeholder="Ex: Artigo, Vídeo, Ansiedade" required />
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-text-main-light dark:text-text-main-dark text-sm font-medium pb-2" for="descricao">Descrição</label>
                            <textarea
                                class="form-textarea w-full rounded-lg text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark/50 focus:border-primary placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base"
                                id="descricao" name="descricao" rows="5" required></textarea>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-text-main-light dark:text-text-main-dark text-sm font-medium pb-2" for="linkExterno">Link Externo (URL)</label>
                            <input
                                class="form-input w-full rounded-lg text-text-main-light dark:text-text-main-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark/50 focus:border-primary h-12 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark px-4 text-base"
                                id="linkExterno" name="linkExterno" type="url" placeholder="https://..." required />
                        </div>
                        
                        <div class="flex justify-end gap-4 pt-4 border-t border-border-light dark:border-border-dark">
                            <a href="./admin-recursos.html"
                                class="px-6 py-2.5 rounded-lg text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                                type="button">Cancelar</a>
                            <button
                                classs="px-6 py-2.5 rounded-lg text-sm font-semibold bg-primary text-white hover:bg-opacity-90 transition-colors"
                                type="submit" id="save-button">Salvar Recurso</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Gerenciamento de Sessão (Admin) ---
            const userNameEl = document.getElementById('user-name');
            const userAvatarEl = document.getElementById('user-avatar');
            const logoutButtonSidebar = document.getElementById('logout-button-sidebar');

            const usuarioString = sessionStorage.getItem('zenworkUser');
            let usuario = null;

            if (usuarioString) {
                try {
                    usuario = JSON.parse(usuarioString);
                } catch (e) {
                    window.location.href = './login.html';
                }
            }

            if (!usuario || !usuario.isAdmin) {
                console.warn("Acesso não autorizado. Usuário não é admin.");
                sessionStorage.removeItem('zenworkUser');
                window.location.href = './login.html';
            } else {
                const adminName = usuario.nome.split(' ')[0];
                userNameEl.textContent = adminName;
                const inicial = usuario.nome ? usuario.nome.charAt(0).toUpperCase() : 'A';
                userAvatarEl.style.backgroundImage = `url("https://placehold.co/100x100/24a5e5/FFFFFF?text=${inicial}&font=inter")`;
            }

            logoutButtonSidebar.addEventListener('click', (e) => {
                e.preventDefault();
                sessionStorage.removeItem('zenworkUser');
                window.location.href = './login.html';
            });
            // --- Fim da Sessão ---

            // --- Lógica do Formulário (CRUD - Create/Update) ---
            const form = document.getElementById('recurso-form');
            const pageTitle = document.getElementById('page-title');
            const pageHeader = document.getElementById('page-header');
            const saveButton = document.getElementById('save-button');
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-text');
            
            // Elementos do formulário
            const idRecursoInput = document.getElementById('idRecurso');
            const tituloInput = document.getElementById('titulo');
            const categoriaInput = document.getElementById('categoria');
            const descricaoInput = document.getElementById('descricao');
            const linkExternoInput = document.getElementById('linkExterno');

            // Verifica se está em modo "Editar" (se tem um ID na URL)
            const urlParams = new URLSearchParams(window.location.search);
            const recursoId = urlParams.get('id');
            const isEditMode = !!recursoId;

            if (isEditMode) {
                // Modo Edição
                pageTitle.textContent = "Editar Recurso";
                pageHeader.textContent = "Editar Recurso";
                saveButton.textContent = "Salvar Alterações";
                loadRecursoParaEditar(recursoId);
            } else {
                // Modo Criação (padrão)
                pageTitle.textContent = "Adicionar Recurso";
                pageHeader.textContent = "Adicionar Novo Recurso";
                saveButton.textContent = "Salvar Recurso";
            }

            // Função para carregar os dados do recurso no formulário (Modo Edição)
            async function loadRecursoParaEditar(id) {
                // *** PONTO DE INTEGRAÇÃO COM O BACKEND JAVA ***
                // O Servlet /demo/admin-recursos responde a GET com ?id=...
                const url = `/demo/admin-recursos?id=${id}`;
                
                try {
                    // --- CÓDIGO REAL ---
                    const response = await fetch(url);
                    const recurso = await response.json();
                    
                    if(response.ok) {
                        idRecursoInput.value = recurso.idRecurso;
                        tituloInput.value = recurso.titulo;
                        categoriaInput.value = recurso.categoria;
                        descricaoInput.value = recurso.descricao;
                        linkExternoInput.value = recurso.linkExterno;
                    } else {
                        throw new Error(recurso.message || "Recurso não encontrado");
                    }
                
                } catch (error) {
                    showMessage(error.message, 'error');
                }
            }
            
            // Event listener para salvar (Create ou Update)
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const formData = {
                    idRecurso: idRecursoInput.value ? parseInt(idRecursoInput.value) : 0,
                    titulo: tituloInput.value,
                    categoria: categoriaInput.value,
                    descricao: descricaoInput.value,
                    linkExterno: linkExternoInput.value
                };

                // *** PONTO DE INTEGRAÇÃO COM O BACKEND JAVA ***
                // O Servlet /demo/admin-recursos responde a POST (para criar) e PUT (para atualizar)
                const url = '/demo/admin-recursos';
                const method = isEditMode ? 'PUT' : 'POST';

                saveButton.disabled = true;
                saveButton.textContent = 'Salvando...';

                try {
                    // --- CÓDIGO REAL ---
                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.status === 'success') {
                        showMessage(data.message, 'success');
                        setTimeout(() => {
                            window.location.href = './admin-recursos.html';
                        }, 1500);
                    } else {
                        throw new Error(data.message || "Erro ao salvar recurso");
                    }

                } catch (error) {
                    showMessage(error.message, 'error');
                    saveButton.disabled = false;
                    saveButton.textContent = isEditMode ? 'Salvar Alterações' : 'Salvar Recurso';
                }
            });

            // Função para mostrar mensagens
            function showMessage(message, type) {
                messageText.textContent = message;
                if (type === 'success') {
                    messageBox.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700');
                    messageBox.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
                } else {
                    messageBox.classList.remove('hidden', 'bg-green-100', 'border-green-400', 'text-green-700');
                    messageBox.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
                }
            }

        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ZenWork - Check-in Emocional</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <!-- 
      *** CONFIGURAÇÃO UNIFICADA DO TAILWIND ***
    -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#48B2A9", // Verde-azulado calmo
                        "background-light": "#F8F9FA", // Cinza muito claro
                        "background-dark": "#111c21",
                        "text-main-light": "#343A40", // Cinza escuro
                        "text-main-dark": "#E9ECEF",
                        "text-secondary-light": "#6c757d",
                        "text-secondary-dark": "#adb5bd",
                        "border-light": "#dee2e6",
                        "border-dark": "#495057",
                        "card-light": "#FFFFFF",
                        "card-dark": "#1a2a32",
                        "happy": "#FFF4D5",
                        "neutral": "#E9ECEF",
                        "tired": "#E6E6FA",
                        "stressed": "#FFE5D9",
                        "happy-dark": "#57481D",
                        "neutral-dark": "#495057",
                        "tired-dark": "#505072",
                        "stressed-dark": "#613A2B"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow">
            
            <!-- 
              *** BARRA LATERAL UNIFICADA ***
            -->
            <aside class="flex-col w-64 gap-8 border-r border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark p-6 hidden lg:flex fixed h-full">
                <!-- Logo -->
                <div class="flex flex-col gap-2">
                    <div class="flex items-center gap-3">
                        <div class="text-primary size-7">
                            <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                               <path d="M39.5563 34.1455V13.8546C39.5563 15.708 36.8773 17.3437 32.7927 18.3189C30.2914 18.916 27.263 19.2655 24 19.2655C20.737 19.2655 17.7086 18.916 15.2073 18.3189C11.1227 17.3437 8.44365 15.708 8.44365 13.8546V34.1455C8.44365 35.9988 11.1227 37.6346 15.2073 38.6098C17.7086 39.2069 20.737 39.5564 24 39.5564C27.263 39.5564 30.2914 39.2069 32.7927 38.6098C36.8773 37.6346 39.5563 35.9988 39.5563 34.1455Z"></path>
                               <path clip-rule="evenodd" d="M10.4485 13.8519C10.4749 13.9271 10.6203 14.246 11.379 14.7361C12.298 15.3298 13.7492 15.9145 15.6717 16.3735C18.0007 16.9296 20.8712 17.2655 24 17.2655C27.1288 17.2655 29.9993 16.9296 32.3283 16.3735C34.2508 15.9145 35.702 15.3298 36.621 14.7361C37.3796 14.246 37.5251 13.9271 37.5515 13.8519C37.5287 13.7876 37.4333 13.5973 37.0635 13.2931C36.5266 12.8516 35.6288 12.3647 34.343 11.9175C31.79 11.0295 28.1333 10.4437 24 10.4437C19.8667 10.4437 16.2099 11.0295 13.657 11.9175C12.3712 12.3647 11.4734 12.8516 10.9365 13.2931C10.5667 13.5973 10.4713 13.7876 10.4485 13.8519ZM37.5563 18.7877C36.3176 19.3925 34.8502 19.8839 33.2571 20.2642C30.5836 20.9025 27.3973 21.2655 24 21.2655C20.6027 21.2655 17.4164 20.9025 14.7429 20.2642C13.1498 19.8839 11.6824 19.3925 10.4436 18.7877V34.1275C10.4515 34.1545 10.5427 34.4867 11.379 35.027C12.298 35.6207 13.7492 36.2054 15.6717 36.6644C18.0007 37.2205 20.8712 37.5564 24 37.5564C27.1288 37.5564 29.9993 37.2205 32.3283 36.6644C34.2508 36.2054 35.702 35.6207 36.621 35.027C37.4573 34.4867 37.5485 34.1546 37.5563 34.1275V18.7877ZM41.5563 13.8546V34.1455C41.5563 36.1078 40.158 37.5042 38.7915 38.3869C37.3498 39.3182 35.4192 40.0389 33.2571 40.5551C30.5836 41.1934 27.3973 41.5564 24 41.5564C20.6027 41.5564 17.4164 41.1934 14.7429 40.5551C12.5808 40.0389 10.6502 39.3182 9.20848 38.3869C7.84205 37.5042 6.44365 36.1078 6.44365 34.1455L6.44365 13.8546C6.44365 12.2684 7.37223 11.0454 8.39581 10.2036C9.43325 9.3505 10.8137 8.67141 12.343 8.13948C15.4203 7.06909 19.5418 6.44366 24 6.44366C28.4582 6.44366 32.5797 7.06909 35.657 8.13948C37.1863 8.67141 38.5667 9.3505 39.6042 10.2036C40.6278 11.0454 41.5563 12.2684 41.5563 13.8546Z" fill-rule="evenodd"></path>
                            </svg>
                        </div>
                        <h1 class="text-xl font-bold leading-tight tracking-[-0.015em] text-text-main-light dark:text-text-main-dark">ZenWork</h1>
                    </div>
                </div>
                <!-- Navegação -->
                <nav class="flex flex-col gap-2">
                    <!-- Link "Check-in" está ATIVO -->
                    <a class="flex items-center gap-3 rounded-lg px-3 py-2 bg-primary/10 text-primary transition-colors font-bold" href="./dashboard.html"><span class="material-symbols-outlined !text-2xl">sentiment_satisfied</span><span class="">Check-in</span></a>
                    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-secondary-light dark:text-text-secondary-dark hover:bg-background-light dark:hover:bg-background-dark transition-colors" href="./historico.html"><span class="material-symbols-outlined !text-2xl">history</span><span class="font-medium">Meu Histórico</span></a>
                    <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-secondary-light dark:text-text-secondary-dark hover:bg-background-light dark:hover:bg-background-dark transition-colors" href="./recursos.html"><span class="material-symbols-outlined !text-2xl">menu_book</span><span class="font-medium">Recursos</span></a>
                </nav>
                <!-- Link de Admin (Condicional) -->
                <nav id="admin-link-container" class="mt-4 pt-4 border-t border-border-light dark:border-border-dark">
                    <!-- O JavaScript vai inserir o link do admin aqui se necessário -->
                </nav>

                <!-- Logout no final da barra lateral -->
                <nav class="mt-auto pt-4">
                     <a id="logout-button" class="flex items-center gap-3 rounded-lg px-3 py-2 text-text-secondary-light dark:text-text-secondary-dark hover:bg-background-light dark:hover:bg-background-dark transition-colors" href="#">
                        <span class="material-symbols-outlined !text-2xl">logout</span>
                        <span class="font-medium">Sair</span>
                    </a>
                </nav>
            </aside>

            <!-- Conteúdo Principal -->
            <div class="flex flex-1 flex-col lg:pl-64"> <!-- Adicionado pl-64 para não sobrepor a sidebar em telas grandes -->
                <div class="flex flex-1 justify-center py-5 sm:px-6 lg:px-8">
                    <div class="layout-content-container flex flex-col w-full max-w-4xl px-4">
                        <!-- Cabeçalho com Avatar -->
                        <header class="flex items-center justify-between whitespace-nowrap px-2 md:px-6 py-4 mb-8">
                            <div>
                                 <!-- Botão de Menu Mobile (para telas menores que lg) -->
                                 <button class="lg:hidden text-text-secondary-light dark:text-text-secondary-dark" id="mobile-menu-button">
                                    <span class="material-symbols-outlined !text-3xl">menu</span>
                                </button>
                            </div>
                            <div class="flex flex-1 justify-end items-center gap-4">
                                <p class="text-base font-medium" id="user-name">Olá, ...</p>
                                <div id="user-avatar" class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Avatar do usuário" style='background-image: url("https://placehold.co/100x100/48B2A9/FFFFFF?text=Z&font=inter");'></div>
                            </div>
                        </header>
                        <!-- Conteúdo do Check-in -->
                        <main class="flex flex-col gap-10 items-center text-center px-2 md:px-6 py-5">
                            <div class="flex flex-col gap-3">
                                <h2 class="text-4xl sm:text-5xl font-black leading-tight tracking-[-0.033em]">Como você se sente hoje?</h2>

                            </div>
                            
                            <!-- 
                              *** CORREÇÃO DA BARRA VERMELHA ***
                              A classe 'hidden' foi adicionada corretamente
                            -->
                             <div id="error-message" class="hidden w-full max-w-2xl bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg" role="alert">
                                <span class="block sm:inline" id="error-text"></span>
                            </div>

                            <!-- Formulário de Check-in -->
                            <form id="checkin-form" class="w-full flex flex-col items-center gap-8">
                                <!-- Botões de Emoção -->
                                <div class="w-full grid grid-cols-2 lg:grid-cols-4 gap-4">
                                    <button type="button" data-emotion="Feliz" class="emotion-button flex flex-1 flex-col gap-4 rounded-xl border-2 border-transparent bg-happy dark:bg-happy-dark p-6 items-center justify-center cursor-pointer transition-all hover:scale-105 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark focus:outline-none">
                                        <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark !text-4xl">sentiment_very_satisfied</span>
                                        <h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight">Feliz</h3>
                                    </button>
                                    <button type="button" data-emotion="Neutro" class="emotion-button flex flex-1 flex-col gap-4 rounded-xl border-2 border-transparent bg-neutral dark:bg-neutral-dark p-6 items-center justify-center cursor-pointer transition-all hover:scale-105 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark focus:outline-none">
                                        <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark !text-4xl">sentiment_neutral</span>
                                        <h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight">Neutro</h3>
                                    </button>
                                    <button type="button" data-emotion="Cansado" class="emotion-button flex flex-1 flex-col gap-4 rounded-xl border-2 border-transparent bg-tired dark:bg-tired-dark p-6 items-center justify-center cursor-pointer transition-all hover:scale-105 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark focus:outline-none">
                                        <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark !text-4xl">sentiment_dissatisfied</span>
                                        <h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight">Cansado</h3>
                                    </button>
                                    <button type="button" data-emotion="Estressado" class="emotion-button flex flex-1 flex-col gap-4 rounded-xl border-2 border-transparent bg-stressed dark:bg-stressed-dark p-6 items-center justify-center cursor-pointer transition-all hover:scale-105 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark focus:outline-none">
                                        <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark !text-4xl">sentiment_stressed</span>
                                        <h3 class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-tight">Estressado</h3>
                                    </button>
                                </div>

                                <!-- Campo de Comentário -->
                                <div class="flex w-full max-w-2xl flex-wrap items-end gap-4 text-left">
                                    <label class="flex flex-col w-full flex-1">
                                        <p class="text-base font-medium leading-normal pb-2">Quer compartilhar um pouco mais? (opcional)</p>
                                        <textarea id="comentario" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg bg-card-light dark:bg-card-dark text-text-main-light dark:text-text-main-dark placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark focus:outline-none focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark focus:border-primary min-h-36 p-4 text-base font-normal leading-normal" placeholder="Descreva como você está se sentindo..."></textarea>
                                    </label>
                                </div>

                                <!-- Botão de Salvar -->
                                <div class="flex w-full max-w-xs justify-center pt-4">
                                    <button id="submit-checkin" type="submit" class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] transition-all hover:opacity-90 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50" disabled>
                                        <span class="truncate">Salvar Check-in</span>
                                    </button>
                                </div>
                            </form>

                        </main>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 
      *** SCRIPT UNIFICADO ***
    -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elementos Globais
            const userNameEl = document.getElementById('user-name');
            const userAvatarEl = document.getElementById('user-avatar');
            const adminLinkContainer = document.getElementById('admin-link-container');
            const logoutButton = document.getElementById('logout-button');
            
            // Elementos Específicos da Página
            const checkinForm = document.getElementById('checkin-form');
            const emotionButtons = document.querySelectorAll('.emotion-button');
            const comentarioInput = document.getElementById('comentario');
            const submitButton = document.getElementById('submit-checkin');
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            let selectedEmotion = null;

            // --- Gerenciamento de Sessão (Unificado) ---
            const usuarioString = sessionStorage.getItem('zenworkUser');
            let usuario = null;

            if (usuarioString) {
                usuario = JSON.parse(usuarioString);
            }

            if (usuario) {
                // 1. Preenche o nome do usuário
                userNameEl.textContent = `Olá, ${usuario.nome}!`;
                
                // 2. Cria o avatar com a inicial
                const inicial = usuario.nome ? usuario.nome.charAt(0).toUpperCase() : 'Z';
                userAvatarEl.style.backgroundImage = `url("https://placehold.co/100x100/48B2A9/FFFFFF?text=${inicial}&font=inter")`;

                // 3. Mostra o link de Admin se for admin
                if (usuario.isAdmin) {
                    adminLinkContainer.innerHTML = `
                        <a class="flex items-center gap-3 rounded-lg px-3 py-2 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors" href="./admin-recursos.html">
                            <span class="material-symbols-outlined !text-2xl">admin_panel_settings</span>
                            <span class="font-bold">Painel Admin</span>
                        </a>`;
                }
            } else {
                console.warn("Nenhum usuário logado, redirecionando para login.");
                window.location.href = './login.html';
            }

            // Lógica do botão de logout
            logoutButton.addEventListener('click', (e) => {
                e.preventDefault();
                sessionStorage.removeItem('zenworkUser');
                // *** PONTO DE INTEGRAÇÃO COM O BACKEND JAVA ***
                // Chamar o servlet de logout para invalidar a sessão no backend
                // fetch('/demo/logout', { method: 'POST' })
                // .then(() => window.location.href = './login.html');
                
                console.log('Logout...');
                window.location.href = './login.html';
            });
            // --- Fim do Gerenciamento de Sessão ---


            // --- Lógica Específica desta Página (Check-in) ---

            if (checkinForm) { // Garante que este código só rode no dashboard.html
                
                // Lógica de Seleção de Emoção
                emotionButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        // Limpa a seleção de todos
                        emotionButtons.forEach(btn => {
                            btn.classList.remove('ring-4', 'ring-primary', 'ring-offset-background-light', 'dark:ring-offset-background-dark');
                            btn.classList.add('border-transparent');
                        });

                        // Adiciona seleção ao clicado
                        button.classList.add('ring-4', 'ring-primary', 'ring-offset-background-light', 'dark:ring-offset-background-dark');
                        button.classList.remove('border-transparent');
                        
                        selectedEmotion = button.dataset.emotion;
                        submitButton.disabled = false; // Habilita o botão de salvar
                    });
                });

                // Lógica de Submissão do Check-in
                checkinForm.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    
                    if (!selectedEmotion) {
                        errorText.textContent = 'Por favor, selecione uma emoção.';
                        errorMessage.classList.remove('hidden');
                        return;
                    }

                    submitButton.disabled = true;
                    submitButton.textContent = 'Salvando...';
                    errorMessage.classList.add('hidden');

                    const checkinData = {
                        idUsuario: usuario.idUsuario, // Pega o ID do usuário logado
                        emocao: selectedEmotion,
                        comentario: comentarioInput.value
                    };

                    // *** PONTO DE INTEGRAÇÃO COM O BACKEND JAVA ***
                    const url = '/demo/checkin'; // URL correta

                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(checkinData)
                        });
                        
                        // O Servlet de Checkin ainda não foi criado, então isso vai falhar
                        // Vamos simular por enquanto
                        if (!response.ok) {
                             throw new Error(`O backend ainda não responde em ${url}`);
                        }
                        
                        const data = await response.json();

                        if (response.ok && data.status === "success") {
                            window.location.href = './recursos.html';
                        } else {
                            throw new Error(data.message || "Erro ao salvar check-in");
                        }

                    } catch (error) {
                        // *** SIMULAÇÃO DE SUCESSO *** // Remova este bloco 'catch' e descomente o 'try' quando o backend estiver pronto
                        console.log("Simulando sucesso e redirecionando para recursos...");
                        window.location.href = './recursos.html';
                        
                        /*
                        // Este é o código de erro real:
                        errorText.textContent = "Erro ao conectar com o servidor: " + error.message;
                        errorMessage.classList.remove('hidden');
                        submitButton.disabled = false;
                        submitButton.textContent = 'Salvar Check-in';
                        */
                    }
                });
            }
        });
    </script>
</body>
</html>
